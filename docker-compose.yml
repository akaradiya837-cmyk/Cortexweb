services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: cortexweb
      MYSQL_USER: cortexweb_app
      MYSQL_PASSWORD: CortexWeb@12345
      MYSQL_ROOT_PASSWORD: CortexWebRoot@12345
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "cortexweb_app", "-pCortexWeb@12345"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      SESSION_SECRET: CortexWeb-local-dev-secret-2026
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: cortexweb
      MYSQL_USER: cortexweb_app
      MYSQL_PASSWORD: CortexWeb@12345
      MYSQL_CONNECTION_LIMIT: 10
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_SECURE: "false"
      SMTP_USER: your-smtp-username
      SMTP_PASSWORD: your-smtp-password
      SMTP_FROM: CortexWeb <no-reply@example.com>
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data: